[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalpages"
version = "0.1.0"
description = "Turn a PDF into spoken audio with an offline, local text-to-speech engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali" }]
# Kokoro 0.9.x supports Python 3.10-3.12 only.
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "kokoro>=0.9.4",
    "pydub>=0.25",
    "platformdirs>=4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["pyinstaller>=6"]

[project.scripts]
vocalpages = "vocalpages.__main__:main"
vocalpages-cli = "vocalpages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # pydub 0.25 source uses invalid regex escapes; harmless.
    "ignore:invalid escape sequence:SyntaxWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
